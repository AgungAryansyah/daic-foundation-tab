[project]
name = "daic-foundation-tab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AgungAryansyah", email = "agungaryansyah2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "psutil>=6.0",
    "pyarrow>=17.0",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "tabicl[finetune]",
    "torch>=2.2",
    "wandb>=0.29",
]

[project.scripts]
daic-foundation-tab = "daic_foundation_tab.cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_model: requires a locally available TabICL checkpoint",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
