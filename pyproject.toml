[project]
name = "daic-foundation-tab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AgungAryansyah", email = "agungaryansyah2006@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "psutil>=6.0",
    "pyarrow>=17.0",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "tabicl[finetune]",
    "tabpfn==9.1.0",
    "torch==2.9.1+cu130",
    "wandb>=0.29",
]

[project.scripts]
daic-foundation-tab = "daic_foundation_tab.cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_model: requires CUDA and a locally available foundation-model checkpoint",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
