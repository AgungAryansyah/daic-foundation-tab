input:
  kind: transcript

project:
  seed: 42
  output_root: outputs/text
  cache_root: cache

runtime:
  device: cuda:0
  require_cuda: true

data:
  dataset_id: daic_woz
  root: data
  labels:
    train: original_labels/train_split_Depression_AVEC2017.csv
    dev: original_labels/dev_split_Depression_AVEC2017.csv
    test: original_labels/test_split_Depression_AVEC2017.csv
  test_ground_truth: original_labels/full_test_split.csv
  transcripts:
    pattern: data/{participant_id}_TRANSCRIPT.csv
    delimiter: "\t"
    columns:
      speaker: speaker
      text: value
    speaker_policy: participant_only
    participant_speakers: [Participant]
    interviewer_speakers: [Ellie, Interviewer]

experiment:
  task: classification
  mode: frozen_icl

model:
  name: qwen35_2b
  model_id: Qwen/Qwen3.5-2B
  revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  parameters:
    dtype: bfloat16
    enable_thinking: false
    max_length: 4096
    max_new_tokens: 8
    demonstrations: 0
    epochs: 1
    gradient_accumulation_steps: 4
    learning_rate: 0.0002
    lora_rank: 8
    checkpoint_steps: 10

evaluation:
  threshold: 0.5
  test_predictions: true
  fine_tuning:
    validation_fraction: 0.2
    validation_seed: 42
  repeated_holdout:
    enabled: false

bootstrap:
  enabled: false

logging:
  level: INFO

tracking:
  wandb:
    enabled: false
    mode: disabled
    project: daic-foundation-tab

study:
  required_inputs: [transcript]
