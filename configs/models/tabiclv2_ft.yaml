model:
  name: tabiclv2_ft
  checkpoint_version: tabicl-classifier-v2-20260212.ckpt
  parameters:
    epochs: 50
    learning_rate: 0.00001
    weight_decay: 0.01
    grad_clip: 1.0
    amp: auto
    use_lr_scheduler: true
    warmup_proportion: 0.1
    n_estimators_finetune: 2
    n_estimators_validation: 2
    n_estimators_inference: 8
    max_data_size: 10000
    finetune_ctx_query_ratio: 0.2
    early_stopping: true
    patience: 10
    min_delta: 0.0001
    time_limit: null
    save_interval: 0
    eval_metric: roc_auc
    device: auto
    random_state: 42
    verbose: false
